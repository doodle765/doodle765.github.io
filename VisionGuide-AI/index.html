<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VisionGuide AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>VisionGuide AI</h1>
    <p>AI-Powered Navigation for Visually Impaired People</p>

    <button id="startBtn">Start Navigation</button>
    <button id="repeatBtn">Repeat Instructions</button>
    <button id="stopBtn">Stop Navigation</button>

    <p id="status" role="status" aria-live="polite">
      Welcome to VisionGuide AI.
    </p>
  </main>

  <section aria-label="Camera navigation">
    <h2>Live Camera View</h2>
    <button id="voiceControlBtn" onclick="startVoiceControl()">
  Start Voice Control
</button>

    <button id="cameraBtn">Open Camera</button>
    <button id="closeCameraBtn">Close Camera</button>

    <video id="camera"
           autoplay
           playsinline
           muted
           style="width:100%; max-width:600px;">
    </video>

    <p id="cameraStatus" role="status" aria-live="polite">
      Camera is not started.
    </p>

    <button id="testVoiceBtn" onclick="testSpeech()">
  Test Voice
</button>

    <h2>AI Object Detection</h2>

    <button id="detectBtn">Start AI Detection</button>

    <p id="aiStatus" role="status" aria-live="polite">
      AI model is not loaded yet.
    </p>

    <h3>Objects Detected</h3>
    <ul id="detections"></ul>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="script.js"></script>
</body>
</html>
